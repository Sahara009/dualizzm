# /etc/nginx/sites-available/dualizzm  (потом: ln -s в sites-enabled, nginx -t, systemctl reload nginx)
# HTTPS добавит certbot: certbot --nginx -d dualizzm.com -d www.dualizzm.com
server {
  listen 80;
  server_name dualizzm.com www.dualizzm.com;

  # фото работ из админки до 12 МБ
  client_max_body_size 15m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # перезаписываем, а не дописываем: так адрес посетителя нельзя подделать (на нём лимиты входа и формы)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
